name: MarginLift CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements-ml.txt
      - run: npm test
      - run: npm run retention:model:test
      - run: docker build --tag marginlift:ci .
      - run: docker build --tag marginlift-shadow-scorer:ci ./api
