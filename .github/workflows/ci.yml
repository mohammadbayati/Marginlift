name: MarginLift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-ml.txt
      - name: Run test suite
        run: npm test
      - name: Run retention model tests
        run: npm run retention:model:test
      - name: Build application image
        run: docker build --tag marginlift:ci .
      - name: Build shadow scorer image
        run: docker build --tag marginlift-shadow-scorer:ci ./api
