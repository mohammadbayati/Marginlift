services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marginlift
      POSTGRES_USER: marginlift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginlift -d marginlift"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shadow-scorer:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MARGINLIFT_MODEL_REGISTRY: /models
      MARGINLIFT_TRAINING_DATA: /training/examples.jsonl
      SCORER_AUTH_REQUIRED: "true"
      SCORER_INTERNAL_TOKEN: ${SCORER_INTERNAL_TOKEN}
      SCORER_INTERNAL_TOKEN_PREVIOUS: ${SCORER_INTERNAL_TOKEN_PREVIOUS:-}
    volumes:
      - model_registry:/models
      - training_data:/training:ro
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://marginlift:${POSTGRES_PASSWORD}@postgres:5432/marginlift
      DATABASE_SSL: "false"
      MARGINLIFT_DB_PATH: /app/data/db.json
      ARTIFACT_STORAGE_PATH: /app/private/artifacts
      MARGINLIFT_FONT_DIR: /app/private/fonts
      MARGINLIFT_JOB_WORKER: "true"
      SHADOW_SCORER_URL: http://shadow-scorer:8100
      SCORER_INTERNAL_TOKEN: ${SCORER_INTERNAL_TOKEN}
      SCORER_INTERNAL_TOKEN_ID: ${SCORER_INTERNAL_TOKEN_ID:-}
      TRAINING_DATA_DIR: /training
    depends_on:
      postgres:
        condition: service_healthy
      shadow-scorer:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
      - ./private/fonts:/app/private/fonts:ro
      - artifact_data:/app/private/artifacts
      - training_data:/training
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  artifact_data:
  caddy_data:
  caddy_config:
  model_registry:
  training_data:
